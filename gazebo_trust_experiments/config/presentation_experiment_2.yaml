name: experiment_2_full_trust_physics
output_dir: ../results
map:
  file: ../maps/room-32-32-4.map
  cell_size: 0.5
  wall_height: 1.0
simulation:
  headless: false
  render_engine: ogre
  real_time_factor: 1.0
  max_step_size: 0.004
  timeout_sim_seconds: 300.0
  startup_delay_seconds: 1.5
  seed: 22
  startup_timeout_seconds: 25.0
  collision_detector: fcl
  solver_type: pgs
planning:
  algorithm: astar
  allow_diagonal: false
  replan_every_steps: 24
  control_rate_hz: 12.0
  linear_speed: 0.22
  angular_speed: 0.95
  waypoint_tolerance: 0.055
  goal_tolerance: 0.14
  emergency_stop_distance: 0.17
  near_collision_distance: 0.28
  heading_tolerance: 0.09
  corner_slow_distance: 0.2
  min_linear_speed: 0.06
  emergency_forward_half_angle: 0.7
  drive_realign_tolerance: 0.04
  turn_settle_cycles: 3
  waypoint_stop_cycles: 2
mapping:
  mode: full_trust
  occupied_threshold: 50
  publish_rate_hz: 1.0
sensing:
  ray_stride: 10
  free_space_step: 0.25
  max_free_cells_per_ray: 6
  claim_dedupe_seconds: 0.75
  self_exclusion_radius_m: 0.4
network:
  communication_delay_seconds: 0.2
  jitter_seconds: 0.05
  packet_loss_probability: 0.0
environment:
  delivery_goal_pool:
    mode: auto_spread
    count: 12
    min_separation_cells: 4
    edge_margin_cells: 2
  temporary_obstacles:
  - id: temporary_box_1
    cell: auto
    placement:
      robot_id: robot_0
      route_fraction: 0.45
    appear_time: 20.0
    disappear_time: 60.0
    size:
    - 0.42
    - 0.42
    - 0.6
    color: 0.95 0.55 0.10 1
  - id: temporary_box_2
    cell: auto
    placement:
      robot_id: robot_1
      route_fraction: 0.6
    appear_time: 95.0
    disappear_time: 145.0
    size:
    - 0.42
    - 0.42
    - 0.6
    color: 0.80 0.25 0.10 1
attack:
  enabled: true
  robot_id: attacker_1
  modules:
  - name: fake_chokepoint_obstacles
    type: false_obstacle
    start_time: 70.0
    end_time: 220.0
    publish_period: 3.0
    candidate_cells: auto
    placement:
      robot_id: robot_0
      route_fractions:
      - 0.35
      - 0.5
      - 0.65
    parameters:
      confidence: 1.0
      claims_per_tick: 1
  - name: false_clearance_during_real_obstacles
    type: false_clearance
    start_time: 70.0
    end_time: 220.0
    publish_period: 2.5
    parameters:
      confidence: 1.0
      claims_per_tick: 1
  - name: stale_obstacle_reassertion
    type: stale_reassertion
    start_time: 70.0
    end_time: 260.0
    publish_period: 3.5
    parameters:
      confidence: 1.0
      claims_per_tick: 1
metrics:
  hesitation_velocity_threshold: 0.03
  reversal_heading_threshold_degrees: 120
robots:
- id: robot_0
  role: benign_delivery
  start_cell:
  - 2
  - 2
  goal_nodes: auto
  goal_count: 12
  initial_goal_index: 0
  color: 0.10 0.45 0.80 1
  lidar_range: 4.0
  lidar_samples: 90
  lidar_update_rate: 4.0
  max_linear_acceleration: 0.45
  max_angular_acceleration: 1.4
  odom_publish_frequency: 10
  goal_selection: random
  randomize_initial_goal: false
- id: robot_1
  role: benign_delivery
  start_cell:
  - 29
  - 2
  goal_nodes: auto
  goal_count: 12
  initial_goal_index: 1
  color: 0.10 0.75 0.25 1
  lidar_range: 4.0
  lidar_samples: 90
  lidar_update_rate: 4.0
  max_linear_acceleration: 0.45
  max_angular_acceleration: 1.4
  odom_publish_frequency: 10
  goal_selection: random
  randomize_initial_goal: false
- id: attacker_1
  role: delayed_attacker
  start_cell:
  - 2
  - 29
  goal_nodes: auto
  goal_count: 12
  initial_goal_index: 2
  color: 0.85 0.15 0.15 1
  lidar_range: 4.0
  lidar_samples: 90
  lidar_update_rate: 4.0
  max_linear_acceleration: 0.45
  max_angular_acceleration: 1.4
  odom_publish_frequency: 10
  goal_selection: random
  randomize_initial_goal: false
visualization:
  enabled: true
  show_goals: true
  show_initial_routes: true
  route_marker_stride: 1
  route_marker_radius: 0.1
  route_marker_height: 0.018
  goal_radius: 0.15
  goal_height: 0.8
  goal_color: 0.95 0.80 0.15 1
  deduplicate_shared_goals: true
  dynamic_routes: true
